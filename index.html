<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrixTools Overlay</title>
    <link rel="stylesheet" href="styles/overlay.css">
</head>
<body>
    <div id="overlay-root">
        <div id="events-container">
            <div class="event-container" id="latest-follow">
                <span class="label">Latest Follower:</span> <span class="value">-</span>
            </div>
            <div class="event-container" id="latest-subscribe">
                <span class="label">Latest Sub:</span> <span class="value">-</span>
            </div>
            <div class="event-container" id="latest-cheer">
                <span class="label">Latest Cheer:</span> <span class="value">-</span>
            </div>
        </div>
        
        <div id="chat-container"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/modules/twitch.js"></script>
    <script src="js/modules/events.js"></script>

    <script type="module">
        import tmi from 'https://esm.sh/tmi.js';
        import { parseEmotes } from 'https://esm.sh/emotettv';

        class ChatModule {
            constructor(config) {
                this.config = config;
                this.container = null;
                this.client = null;
            }

            init(containerId) {
                this.container = document.getElementById(containerId);
                if (!this.container) return;
                this.applyStyles();
                
                if (this.config.twitchChannel) {
                    this.client = new tmi.Client({
                        channels: [this.config.twitchChannel]
                    });

                    this.client.connect().catch(console.error);
                    this.client.on('message', this.handleMessage.bind(this));
                }
            }

            applyStyles() {
                const settings = this.config;
                const hexToRgba = (hex, opacityPercentage) => {
                    if (!hex || hex.length < 7) return 'rgba(0,0,0,1)';
                    let r = parseInt(hex.slice(1, 3), 16),
                        g = parseInt(hex.slice(3, 5), 16),
                        b = parseInt(hex.slice(5, 7), 16),
                        a = opacityPercentage / 100;
                    return `rgba(${r}, ${g}, ${b}, ${a})`;
                };

                const bgColorWithOpacity = hexToRgba(settings.pillboxBgColor, settings.pillboxOpacity);
                const dynamicStyles = document.createElement('style');

                const border = settings.borderWidth > 0 
                    ? `${settings.borderWidth}px ${settings.borderStyle} ${settings.borderColor}` 
                    : 'none';

                dynamicStyles.innerHTML = `
                    #chat-container { 
                        display: flex;
                        flex-direction: column;
                        gap: ${settings.messageGap}px; 
                    }
                    .chat-message {
                        background-color: ${bgColorWithOpacity};
                        border-radius: ${settings.pillboxRadius}px;
                        padding: ${settings.pillboxPadding};
                        border: ${border};
                        margin-bottom: 0;
                    }
                    .username {
                        font-family: ${settings.userFontFamily};
                        font-size: ${settings.userFontSize}px;
                        font-weight: ${settings.userFontWeight};
                        font-style: ${settings.userFontStyle};
                        text-transform: ${settings.userTextTransform};
                        letter-spacing: ${settings.userLetterSpacing}px;
                        text-shadow: 1px 1px ${settings.userShadowBlur}px ${settings.userShadowColor};
                    }
                    .message-text {
                        font-family: ${settings.msgFontFamily};
                        color: ${settings.msgColor};
                        font-size: ${settings.msgFontSize}px;
                        font-weight: ${settings.msgFontWeight};
                        font-style: ${settings.msgFontStyle};
                        letter-spacing: ${settings.msgLetterSpacing}px;
                        text-shadow: 1px 1px ${settings.msgShadowBlur}px ${settings.msgShadowColor};
                    }
                    .fade-out {
                        animation: fadeOut 0.5s forwards;
                    }
                    @keyframes fadeOut {
                        from { opacity: 1; }
                        to { opacity: 0; }
                    }
                `;
                document.head.appendChild(dynamicStyles);
            }

            async handleMessage(channel, tags, message, self) {
                const messageElement = document.createElement('div');
                messageElement.classList.add('chat-message');

                const userColor = tags['color'] || '#9146FF';
                const displayName = tags['display-name'] || tags['username'];

                const parsedEmotes = await parseEmotes(message, tags.emotes, {
                    channelId: tags['room-id']
                });

                messageElement.innerHTML = `
                    <span class="username" style="color: ${userColor};">${displayName}:</span>
                    <span class="message-text">${parsedEmotes.toHTML()}</span>
                `;

                this.container.appendChild(messageElement);

                while (this.container.children.length > this.config.maxMessages) {
                    this.container.removeChild(this.container.firstChild);
                }

                if (this.config.messageLifetimeMs > 0) {
                    setTimeout(() => {
                        messageElement.classList.add('fade-out');
                        messageElement.addEventListener('animationend', () => {
                            if (messageElement.parentNode) {
                                messageElement.parentNode.removeChild(messageElement);
                            }
                        });
                    }, this.config.messageLifetimeMs);
                }
            }
        }

        const init = async () => {
            console.log("StrixTools Overlay Initializing...");
            let settings = window.DEFAULT_SETTINGS || {};
            const urlParams = new URLSearchParams(window.location.search);
            const encodedConfig = urlParams.get('cfg');

            if (encodedConfig) {
                console.log("Found configuration in URL, decoding...");
                try {
                    const decodedString = decodeURIComponent(atob(encodedConfig));
                    const customSettings = JSON.parse(decodedString);
                    settings = {
                        general: { ...settings.general, ...customSettings.general },
                        chat: { ...settings.chat, ...customSettings.chat },
                        events: { ...settings.events, ...customSettings.events }
                    };
                    console.log("Configuration decoded successfully.");
                } catch (error) {
                    console.error("Failed to parse settings from URL, falling back to defaults.", error);
                }
            }

            const type = urlParams.get('type');
            const twitchClient = new window.TwitchClient(settings.general);

            if (!type || type === 'chat') {
                const chatModule = new ChatModule({ ...settings.chat, twitchChannel: settings.general.twitchChannel });
                chatModule.init('chat-container');
            } else {
                document.getElementById('chat-container').style.display = 'none';
            }

            const isEvent = ['follow', 'sub', 'cheer'].includes(type);
            const showEvents = !type || isEvent;

            if (showEvents) {
                if (type) {
                    const containers = ['follow', 'sub', 'cheer'];
                    containers.forEach(c => {
                        if (c !== type) {
                            const el = document.getElementById(`latest-${c === 'sub' ? 'subscribe' : c}`);
                            if (el) el.style.display = 'none';
                        }
                    });
                }

                const eventsModule = new window.EventsModule(settings.events, twitchClient);
                await eventsModule.init();
            } else {
                document.getElementById('events-container').style.display = 'none';
            }
            console.log("StrixTools Overlay Initialization Complete.");
        };

        window.onload = init;
    </script>
</body>
</html>
