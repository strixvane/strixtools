<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrixTools Overlay</title>
    <link rel="stylesheet" href="styles/overlay.css">
</head>

<body>
    <div id="overlay-root">
        <div id="events-container">
            <div class="event-container" id="latest-follow">
                <span class="label">Latest Follower:</span> <span class="value">-</span>
            </div>
            <div class="event-container" id="latest-subscribe">
                <span class="label">Latest Sub:</span> <span class="value">-</span>
            </div>
            <div class="event-container" id="latest-cheer">
                <span class="label">Latest Cheer:</span> <span class="value">-</span>
            </div>
        </div>

        <div id="chat-container"></div>
    </div>

    <script src="js/config.js" defer></script>
    <script src="js/modules/twitch.js" defer></script>
    <script src="js/modules/chat.js" defer></script>
    <script src="js/modules/events.js" defer></script>

    <script type="module">
        import tmi from 'https://esm.sh/tmi.js';
        import { parseEmotes } from 'https://esm.sh/emotettv';

        window.tmi = tmi;
        window.parseEmotes = parseEmotes;

        let chatModule = null;
        let eventsModule = null;
        let currentSettings = window.DEFAULT_SETTINGS || {};

        const applySettings = async (settings) => {
            currentSettings = settings;
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');
            const twitchClient = new window.TwitchClient(settings.general);

            if (!type || type === 'chat') {
                if (chatModule) {
                    chatModule.config = { ...settings.chat, twitchChannel: settings.general.twitchChannel };
                    chatModule.applyStyles();
                } else {
                    chatModule = new window.ChatModule({ ...settings.chat, twitchChannel: settings.general.twitchChannel });
                    chatModule.init('chat-container');
                }
            }

            const isEvent = ['follow', 'sub', 'cheer'].includes(type);
            if (!type || isEvent) {
                if (eventsModule) {
                    eventsModule.config = settings.events;
                    eventsModule.applyStyles();
                } else {
                    eventsModule = new window.EventsModule(settings.events, twitchClient);
                    await eventsModule.init();
                }
            }

            // Handle visibility based on 'type' query parameter
            const eventsContainer = document.getElementById('events-container');
            const chatContainer = document.getElementById('chat-container');
            const followEl = document.getElementById('latest-follow');
            const subEl = document.getElementById('latest-subscribe');
            const cheerEl = document.getElementById('latest-cheer');

            if (type === 'chat') {
                if (eventsContainer) eventsContainer.style.display = 'none';
                if (chatContainer) chatContainer.style.display = '';
            } else if (type === 'follow') {
                if (eventsContainer) eventsContainer.style.display = '';
                if (chatContainer) chatContainer.style.display = 'none';
                if (followEl) followEl.style.display = '';
                if (subEl) subEl.style.display = 'none';
                if (cheerEl) cheerEl.style.display = 'none';
            } else if (type === 'sub') {
                if (eventsContainer) eventsContainer.style.display = '';
                if (chatContainer) chatContainer.style.display = 'none';
                if (followEl) followEl.style.display = 'none';
                if (subEl) subEl.style.display = '';
                if (cheerEl) cheerEl.style.display = 'none';
            } else if (type === 'cheer') {
                if (eventsContainer) eventsContainer.style.display = '';
                if (chatContainer) chatContainer.style.display = 'none';
                if (followEl) followEl.style.display = 'none';
                if (subEl) subEl.style.display = 'none';
                if (cheerEl) cheerEl.style.display = '';
            } else {
                // All-in-one or default
                if (eventsContainer) eventsContainer.style.display = '';
                if (chatContainer) chatContainer.style.display = '';
                if (followEl) followEl.style.display = '';
                if (subEl) subEl.style.display = '';
                if (cheerEl) cheerEl.style.display = '';
            }
        };

        const syncChannel = new BroadcastChannel('strixtools_sync');
        syncChannel.onmessage = (event) => {
            if (event.data.type === 'update') {
                console.log("Live update received via BroadcastChannel");
                applySettings(event.data.settings);
            }
        };

        const init = async () => {
            console.log("StrixTools Overlay Initializing...");
            let settings = window.DEFAULT_SETTINGS || {};
            const urlParams = new URLSearchParams(window.location.search);
            const encodedConfig = urlParams.get('cfg');

            if (encodedConfig) {
                try {
                    const decodedString = decodeURIComponent(atob(encodedConfig));
                    const customSettings = JSON.parse(decodedString);

                    // Deep merge helper
                    const merge = (target, source) => {
                        for (const key in source) {
                            if (source[key] instanceof Object && key in target) {
                                Object.assign(source[key], merge(target[key], source[key]));
                            }
                        }
                        Object.assign(target || {}, source);
                        return target;
                    };

                    settings = merge({ ...settings }, customSettings);
                } catch (error) {
                    console.error("Failed to parse settings from URL", error);
                }
            }

            await applySettings(settings);
            console.log("StrixTools Overlay Initialization Complete.");
        };

        if (document.readyState === 'complete') {
            init();
        } else {
            window.addEventListener('load', init);
        }
    </script>
</body>

</html>
